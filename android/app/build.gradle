plugins {
    id "com.android.application"
}

// Where the Ring Racers v2.4 data lives (bios.pk3, data/*.pk3, gamecontrollerdb.txt).
// Override with -PringRacersData=/path or ringRacersData=... in gradle.properties / local.properties.
def localProps = new Properties()
def localPropsFile = rootProject.file("local.properties")
if (localPropsFile.isFile()) { localPropsFile.withInputStream { localProps.load(it) } }
def propOrEnv = { String name, String env, String fallback ->
    (project.findProperty(name) ?: localProps.getProperty(name) ?: System.getenv(env) ?: fallback)?.toString()
}
def installRoot = new File(propOrEnv("ringRacersData", "RINGRACERS_DATA", rootProject.projectDir.parentFile.parentFile.absolutePath))
def vcpkgRoot = propOrEnv("vcpkgRoot", "VCPKG_ROOT", "C:/vcpkg")
def vcpkgInstalled = propOrEnv("vcpkgInstalled", "VCPKG_INSTALLED_DIR", "")
def vcpkgHostTriplet = propOrEnv("vcpkgHostTriplet", "VCPKG_HOST_TRIPLET",
    System.getProperty("os.name").toLowerCase().contains("mac") ? "arm64-osx" :
    System.getProperty("os.name").toLowerCase().contains("win") ? "x64-mingw-dynamic" : "x64-linux")
def generatedAssets = layout.buildDirectory.dir("generated/ringRacersAssets").get().asFile
def generatedResources = layout.buildDirectory.dir("generated/ringRacersResources").get().asFile
def generatedSdlJava = layout.buildDirectory.dir("generated/sdlJava").get().asFile
def sdlVersion = "2.30.12"
def sdlJavaFiles = [
    "HIDDevice.java",
    "HIDDeviceBLESteamController.java",
    "HIDDeviceManager.java",
    "HIDDeviceUSB.java",
    "SDL.java",
    "SDLActivity.java",
    "SDLAudioManager.java",
    "SDLControllerManager.java",
    "SDLSurface.java"
]
def gameDataFiles = [
    "altmusic.pk3",
    "chars.pk3",
    "followers.pk3",
    "gfx.pk3",
    "maps.pk3",
    "music.pk3",
    "scripts.pk3",
    "shaders.pk3",
    "sounds.pk3",
    "staffghosts.pk3",
    "textures_General.pk3",
    "textures_OriginalZones.pk3",
    "textures_SEGAZones.pk3",
    "unlocks.pk3"
]

def requiredAssets = [
    new File(installRoot, "bios.pk3"),
    new File(installRoot, "gamecontrollerdb.txt")
] + gameDataFiles.collect { new File(installRoot, "data/${it}") }

tasks.register("stageGameAssets", Sync) {
    inputs.files(requiredAssets)
    into(new File(generatedAssets, "game"))

    from(new File(installRoot, "bios.pk3"))
    from(new File(installRoot, "gamecontrollerdb.txt"))
    from(new File(installRoot, "data")) {
        include(gameDataFiles)
        into("data")
        rename { name -> name.toLowerCase(Locale.ROOT) }
    }

    doFirst {
        def missing = requiredAssets.findAll { !it.isFile() }
        if (!missing.isEmpty()) {
            throw new org.gradle.api.GradleException("Missing Ring Racers assets: ${missing.join(', ')}")
        }
    }
}

tasks.register("stageAppIcon", Sync) {
    from(new File(rootProject.projectDir.parentFile, "srb2.png")) {
        rename { "icon.png" }
    }
    into(new File(generatedResources, "drawable"))
}

tasks.register("prepareSdlJava") {
    def packageDirectory = new File(generatedSdlJava, "org/libsdl/app")
    def generatedFiles = sdlJavaFiles.collect { new File(packageDirectory, it) }
    outputs.files(generatedFiles)

    doLast {
        packageDirectory.mkdirs()
        sdlJavaFiles.each { filename ->
            def destination = new File(packageDirectory, filename)
            if (!destination.isFile()) {
                def source = new URL("https://raw.githubusercontent.com/libsdl-org/SDL/release-${sdlVersion}/android-project/app/src/main/java/org/libsdl/app/${filename}")
                source.withInputStream { input ->
                    destination.withOutputStream { output -> output << input }
                }
            }
        }
    }
}

android {
    namespace "org.kartkrew.ringracers"
    compileSdk 34
    ndkVersion propOrEnv("ndkVersion", "ANDROID_NDK_VERSION", "26.3.11579264")

    defaultConfig {
        applicationId "io.github.belmantegu.ringracers"
        minSdk 28
        targetSdk 34
        versionCode 5
        versionName "0.5"

        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                def cmakeArgs = ["-DCMAKE_TOOLCHAIN_FILE=${vcpkgRoot}/scripts/buildsystems/vcpkg.cmake",
                    "-DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=${android.ndkDirectory}/build/cmake/android.toolchain.cmake",
                    "-DVCPKG_TARGET_TRIPLET=arm64-android",
                    "-DVCPKG_HOST_TRIPLET=${vcpkgHostTriplet}"]
                if (vcpkgInstalled) { cmakeArgs += "-DVCPKG_INSTALLED_DIR=${vcpkgInstalled}" }
                arguments(*cmakeArgs)
                arguments "-DVCPKG_MANIFEST_MODE=OFF",
                    "-DSRB2_CONFIG_ENABLE_WEBM_MOVIES=OFF",
                    "-DSRB2_CONFIG_ENABLE_DISCORDRPC=OFF",
                    "-DSRB2_CONFIG_HWRENDER=OFF",
                    "-DSRB2_CONFIG_EXECINFO=OFF",
                    "-DSRB2_CONFIG_STATIC_STDLIB=OFF",
                    "-DSRB2_CONFIG_USEASM=OFF",
                    "-DSRB2_SDL2_EXE_NAME=main",
                    "-DANDROID_STL=c++_shared",
                    "-DCMAKE_BUILD_TYPE=Release"
                cFlags "-U_FORTIFY_SOURCE", "-D_FORTIFY_SOURCE=0", "-O3", "-march=armv8-a+crc+crypto"
                cppFlags "-U_FORTIFY_SOURCE", "-D_FORTIFY_SOURCE=0", "-O3", "-march=armv8-a+crc+crypto"
            }
        }
    }

    // Release signing: paths come from local.properties (never committed).
    def releaseStore = propOrEnv("releaseStoreFile", "RR_RELEASE_STORE", "")
    def releasePassFile = propOrEnv("releaseStorePasswordFile", "RR_RELEASE_PASS_FILE", "")
    if (releaseStore && releasePassFile && new File(releaseStore).isFile()) {
        def pass = new File(releasePassFile).text.trim()
        signingConfigs {
            release {
                storeFile new File(releaseStore)
                storePassword pass
                keyAlias propOrEnv("releaseKeyAlias", "RR_RELEASE_ALIAS", "ringracers")
                keyPassword pass
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            if (signingConfigs.findByName("release") != null) {
                signingConfig signingConfigs.release
            }
            ndk {
                debugSymbolLevel "SYMBOL_TABLE"
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path file("../../CMakeLists.txt")
            version "3.22.1"
        }
    }

    sourceSets {
        main {
            assets.srcDir(generatedAssets)
            java.srcDir(generatedSdlJava)
            res.srcDir(generatedResources)
        }
    }

    androidResources {
        noCompress += ["pk3"]
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

android.applicationVariants.all { variant ->
    variant.outputs.all {
        outputFileName = "RingRacers-Android-${variant.versionName}${variant.buildType.name == 'release' ? '' : '-' + variant.buildType.name}.apk"
    }
}

tasks.named("preBuild").configure {
    dependsOn(tasks.named("stageGameAssets"))
    dependsOn(tasks.named("stageAppIcon"))
    dependsOn(tasks.named("prepareSdlJava"))
}
